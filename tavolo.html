<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Ordina al tavolo</title>
<meta name="theme-color" content="#33421f">
<link rel="apple-touch-icon" href="/icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7eecb; --panel: #fffdf5; --panel-2: #f0e6bd; --ink: #2f3a20; --ink-dim: #6d7a58;
    --accent: #e2604f; --accent-ink: #fff; --verde: #33421f; --error: #c0392b; --ok: #4f7a3a;
    --border: #e6d9a2; --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  body { min-height: 100vh; padding-bottom: var(--spazio-fondo, calc(150px + env(safe-area-inset-bottom))); }
  h1, h2, h3 { margin: 0; font-family: 'Baloo 2', 'Segoe UI', sans-serif; line-height: 1.15; }
  button { font: inherit; cursor: pointer; border: 0; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
  .hidden { display: none !important; }

  /* testata */
  header.top { background: var(--verde); color: #fff; padding: calc(14px + env(safe-area-inset-top)) 0 14px; position: sticky; top: 0; z-index: 20; }
  header.top .wrap { display: flex; align-items: center; gap: 12px; }
  header.top img { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; background: #fff; }
  header.top h1 { font-size: 20px; }
  header.top .sub { font-size: 13px; opacity: .85; }
  .badge-tavolo { margin-left: auto; background: var(--accent); color: #fff; border-radius: 12px; padding: 6px 12px; text-align: center; font-family: 'Baloo 2'; line-height: 1; }
  .badge-tavolo small { display: block; font-size: 11px; font-family: 'Segoe UI', sans-serif; opacity: .9; }
  .badge-tavolo b { font-size: 24px; }

  /* schermata apertura */
  .card { background: var(--panel); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 16px; margin-top: 16px; }
  .card h2 { font-size: 20px; margin-bottom: 4px; }
  .muted { color: var(--ink-dim); font-size: 14px; }
  .persone { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px dashed var(--border); }
  .persone:last-child { border-bottom: 0; }
  .persone .nome { font-weight: 700; font-size: 16px; }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper button { width: 40px; height: 40px; border-radius: 50%; background: var(--panel-2); color: var(--verde); font-size: 22px; font-weight: 700; display: grid; place-items: center; }
  .stepper button:disabled { opacity: .35; }
  .stepper span { min-width: 34px; text-align: center; font-size: 20px; font-weight: 800; font-family: 'Baloo 2'; }
  .menu-scelta { display: block; width: 100%; text-align: left; background: var(--panel); border: 2px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-top: 10px; color: var(--ink); }
  .menu-scelta.sel { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(226,96,79,.15); }
  .menu-scelta .t { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .menu-scelta .t b { font-family: 'Baloo 2'; font-size: 18px; }
  .menu-scelta .p { font-weight: 800; color: var(--accent); white-space: nowrap; }
  .menu-scelta .d { font-size: 13px; color: var(--ink-dim); margin-top: 4px; }
  .btn { display: block; width: 100%; padding: 15px; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 800; font-size: 17px; margin-top: 18px; }
  .btn:disabled { opacity: .5; }
  .btn.sec { background: var(--panel-2); color: var(--verde); }
  .totale-apertura { margin-top: 14px; font-size: 15px; text-align: right; }

  /* barra stato comanda */
  .stato { margin-top: 12px; border-radius: 12px; padding: 10px 14px; font-size: 14px; display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1.5px solid var(--border); }
  .stato.attesa { background: #fff4e5; border-color: #f0c88a; }
  .stato b { font-family: 'Baloo 2'; font-size: 18px; }
  .tabs-viste { display: flex; gap: 8px; margin-top: 12px; }
  .tabs-viste button { flex: 1; padding: 12px; border-radius: 15px; background: rgba(240,244,234,.82); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border: 1.5px solid rgba(51,66,31,.18); color: var(--verde); font-weight: 700; }
  .tabs-viste button.on { background: var(--verde); border-color: var(--verde); color: #fff; box-shadow: 0 6px 16px rgba(51,66,31,.28); }

  /* categorie — in alto (default) */
  nav.cat { position: sticky; top: calc(68px + env(safe-area-inset-top)); z-index: 10; background: var(--bg); padding: 10px 0 8px; margin: 0 -16px; }
  nav.cat .scroll { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px; scrollbar-width: none; }
  nav.cat .scroll::-webkit-scrollbar { display: none; }
  nav.cat button { white-space: nowrap; padding: 9px 16px; border-radius: 99px; background: rgba(224,163,48,.14); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border: 1.5px solid rgba(224,163,48,.32); color: #9a6a12; font-weight: 700; font-size: 14px; }
  nav.cat button.on { background: #e0a330; border-color: #e0a330; color: #fff; box-shadow: 0 6px 16px rgba(224,163,48,.4); }
  section.categoria h3 { font-size: 21px; margin: 18px 0 8px; scroll-margin-top: 130px; }

  /* griglia prodotti — PLU senza cornice, fusi col background */
  .griglia { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px 12px; }
  .prodotto { display: flex; flex-direction: column; background: transparent; border: 0; border-radius: 0; padding: 0; cursor: pointer; position: relative; z-index: 2; }
  section.categoria h3 { position: relative; z-index: 2; }
  .prodotto .media { position: relative; width: 100%; }
  .prodotto .foto, .prodotto .foto-vuota {
    width: 100%; aspect-ratio: 1/1; border-radius: 22px; object-fit: cover; display: block;
    box-shadow: 0 10px 22px rgba(70,56,20,.12); transition: transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .2s ease;
  }
  .prodotto .foto-vuota { background: var(--panel-2); display: grid; place-items: center; font-size: 36px; color: #cdb878; }
  .prodotto:active .foto, .prodotto:active .foto-vuota { transform: scale(.96); box-shadow: 0 6px 14px rgba(70,56,20,.14); }
  .prodotto .nome { font-weight: 700; font-size: 14.5px; margin-top: 9px; line-height: 1.2; padding: 0 3px; }
  .prodotto .desc { font-size: 12px; color: var(--ink-dim); margin-top: 3px; padding: 0 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .prodotto .riga-prezzo { display: flex; align-items: center; gap: 6px; margin-top: 5px; padding: 0 3px; flex-wrap: wrap; min-height: 20px; }
  .prodotto .riga-gia { padding: 3px 3px 0; }
  .prezzo { font-weight: 800; color: var(--accent); }
  .incluso { font-size: 11px; font-weight: 700; color: var(--ok); background: #e7f0de; padding: 2px 8px; border-radius: 99px; }
  .limite { font-size: 11px; color: var(--ink-dim); }
  .allerg-mini { font-size: 12px; letter-spacing: 1px; }
  .gia { color: var(--ok); font-size: 11.5px; font-weight: 800; white-space: nowrap; }
  /* comandi che galleggiano sull'immagine */
  .prodotto .agg { position: absolute; right: 8px; bottom: 8px; display: flex; align-items: center; }
  .prodotto .piu {
    width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 25px; font-weight: 700;
    display: grid; place-items: center; box-shadow: 0 6px 16px rgba(226,96,79,.45); transition: transform .14s ease;
  }
  .prodotto .piu:active { transform: scale(.85); }
  .prodotto .stepper { background: #fff; border-radius: 99px; box-shadow: 0 6px 16px rgba(0,0,0,.2); padding: 2px; }
  .prodotto .stepper button { width: 32px; height: 32px; font-size: 18px; color: var(--verde); }
  .prodotto .stepper span { min-width: 20px; font-size: 16px; }
  .prodotto .stepper .qnew { color: var(--accent); }     /* quantità nuova in rosso */
  .prodotto .qnew-lbl { position: absolute; top: 8px; left: 8px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 99px; box-shadow: 0 3px 8px rgba(226,96,79,.4); }

  /* categorie — a sinistra (body.cat-left): rail verticale grande e moderno */
  body.cat-left #sotto-ordina { display: flex; gap: 14px; align-items: flex-start; }
  /* RUOTA categorie infinita: l'attiva grande al centro, le altre a scalare sopra/sotto,
     e l'anello gira avanti e indietro (dopo l'ultima torna la prima e viceversa) */
  body.cat-left nav.cat {
    position: sticky; top: calc(72px + env(safe-area-inset-top)); z-index: 10;
    flex: 0 0 116px; margin: 0; padding: 0; align-self: flex-start; overflow: hidden;
    height: calc(100dvh - 150px); background: transparent;
  }
  body.cat-left nav.cat .scroll {
    position: relative; display: block; height: 100%; padding: 0;
    background: transparent; border: 0; border-radius: 0; box-shadow: none;
  }
  body.cat-left nav.cat button {
    position: absolute; left: 3px; right: 3px; top: 50%; transform: translateY(-50%);
    min-height: 58px; display: flex; align-items: center; justify-content: center;
    white-space: normal; text-align: center; font-size: 13px; font-weight: 800; line-height: 1.08;
    padding: 6px 5px; border: 1px solid rgba(255,255,255,.65); border-radius: 22px;
    background: linear-gradient(150deg, #ffffff 0%, #e8f1fb 100%); color: #243746;
    box-shadow: 0 6px 15px rgba(93,151,201,.4), inset 0 1px 0 rgba(255,255,255,.9);
    overflow: hidden;
    transition: top .42s cubic-bezier(.2,.85,.25,1), font-size .42s cubic-bezier(.2,.85,.25,1), min-height .42s cubic-bezier(.2,.85,.25,1), opacity .35s ease, background .3s ease, box-shadow .3s ease, color .3s ease;
  }
  body.cat-left nav.cat .cat-gruppo { display: none; }   /* ruota: niente fasce-gruppo inline nel rail */
  /* riflesso diagonale "glass" */
  body.cat-left nav.cat button::after {
    content: ''; position: absolute; top: -40%; left: -30%; width: 90%; height: 60%;
    background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0));
    transform: rotate(-18deg); pointer-events: none; border-radius: 50%;
  }
  body.cat-left nav.cat button.on {
    background: linear-gradient(150deg, #9cc6e8 0%, #5b97c9 100%); color: #fff; border-color: rgba(255,255,255,.4);
    box-shadow: 0 14px 30px rgba(74,130,180,.62), inset 0 1px 0 rgba(255,255,255,.45);
  }
  /* fascia-gruppo (es. "GIAPPONESE") ricavata dal prefisso "Gruppo - Sottocategoria" */
  nav.cat .cat-gruppo { display: none; }
  body.cat-left #lista-prodotti { flex: 1; min-width: 0; position: relative; }
  /* colonna categorie -> prodotti a 2 colonne */
  body.cat-left .griglia { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px 8px; }
  body.cat-left .prodotto { transform-origin: center center; will-change: transform, opacity; }
  body.cat-left .prodotto .nome { font-size: 13px; }
  body.cat-left .prodotto .foto, body.cat-left .prodotto .foto-vuota { border-radius: 16px; }
  body.cat-left .prodotto .piu { width: 34px; height: 34px; font-size: 21px; }
  body.cat-left .prodotto .agg { right: 6px; bottom: 6px; }
  body.cat-left .prodotto .stepper button { width: 27px; height: 27px; font-size: 15px; }
  body.cat-left .prodotto .nome { font-size: 13px; }
  body.cat-left .prodotto .foto, body.cat-left .prodotto .foto-vuota { border-radius: 16px; }
  body.cat-left .prodotto .piu { width: 34px; height: 34px; font-size: 21px; }
  body.cat-left .prodotto .agg { right: 6px; bottom: 6px; }
  body.cat-left .prodotto .stepper button { width: 27px; height: 27px; font-size: 15px; }
  body.cat-left .prodotto .stepper span { min-width: 15px; font-size: 13px; }

  /* fascia-gruppo nella lista prodotti (stesso stile del rail) */
  .prod-gruppo {
    background: #e0a330; color: #fff; font-weight: 800; text-transform: uppercase; letter-spacing: .5px;
    font-size: 14px; padding: 9px 14px; border-radius: 11px; margin: 18px 0 10px; box-shadow: 0 2px 8px rgba(224,163,48,.25);
  }
  section.categoria:first-child > h3, .prod-gruppo:first-child { margin-top: 0; }
  body.cat-left section.categoria h3 { font-size: 19px; margin-top: 2px; scroll-margin-top: 84px; }
  body.cat-left section.categoria:not(:first-child) h3 { margin-top: 18px; }

  /* schermata apertura più grande (coperti e menu) */
  #v-apertura .card { padding: 20px 20px; margin-top: 18px; }
  #v-apertura .card h2 { font-size: 23px; }
  #v-apertura .persone { padding: 16px 0; }
  #v-apertura .persone .nome { font-size: 19px; }
  #v-apertura .stepper { gap: 8px; }
  #v-apertura .stepper button { width: 50px; height: 50px; font-size: 27px; }
  #v-apertura .stepper span { min-width: 46px; font-size: 26px; }
  #v-apertura .menu-scelta { padding: 18px; margin-top: 12px; }
  #v-apertura .menu-scelta .t b { font-size: 20px; }
  #v-apertura .btn { padding: 18px; font-size: 19px; }

  /* barra carrello */
  .barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, transparent); }
  .barra button { max-width: 608px; margin: 0 auto; display: flex; width: 100%; align-items: center; justify-content: space-between; background: var(--verde); color: #fff; border-radius: 14px; padding: 14px 18px; font-weight: 700; font-size: 16px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
  .barra .n { background: var(--accent); border-radius: 99px; padding: 2px 10px; margin-right: 8px; }

  /* barra strumenti sempre visibile in basso (ricerca + viste + allergeni) */
  .barra-strumenti {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 29;
    padding: 9px 16px calc(9px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 82%, rgba(247,241,214,.86) 100%);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    display: flex; flex-direction: column; gap: 8px;
    box-shadow: 0 -6px 18px rgba(70,56,20,.08);
  }
  .barra-strumenti > * { max-width: 608px; margin-left: auto; margin-right: auto; width: 100%; }
  .cerca-box {
    display: flex; align-items: center; gap: 8px;
    background: #fff; border: 1.5px solid rgba(51,66,31,.18); border-radius: 14px;
    padding: 9px 12px; box-shadow: 0 4px 14px rgba(70,56,20,.08);
  }
  .cerca-box .lente { opacity: .55; font-size: 15px; }
  .cerca-box input { flex: 1; border: 0; background: transparent; font-size: 15px; outline: none; color: #243018; min-width: 0; }
  .cerca-box input::-webkit-search-cancel-button { display: none; }
  .cerca-x { background: transparent; color: #8a8f7e; font-weight: 800; font-size: 15px; padding: 2px 6px; line-height: 1; }
  .strumenti-azioni { display: flex; gap: 8px; align-items: stretch; }
  .strumenti-azioni .tabs-viste { flex: 1; margin-top: 0; }
  .strumenti-azioni .barra-filtri { margin: 0; }

  /* fogli dal basso */
  .velo { position: fixed; inset: 0; background: rgba(20,24,12,.45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
  .foglio { background: var(--panel); width: 100%; max-width: 640px; max-height: 88vh; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; }
  .foglio .testa { padding: 16px 18px 10px; display: flex; gap: 10px; align-items: flex-start; border-bottom: 1px solid var(--border); }
  .foglio .testa h2 { font-size: 21px; flex: 1; }
  .foglio .chiudi { background: var(--panel-2); color: var(--verde); width: 34px; height: 34px; border-radius: 50%; font-size: 18px; flex: none; }
  .foglio .corpo { padding: 6px 18px 12px; overflow-y: auto; }
  .foglio .piede { padding: 12px 18px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); }
  .foglio .piede .btn { margin-top: 0; }
  .gruppo { margin-top: 14px; }
  .gruppo .gt { display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; font-family: 'Baloo 2'; font-size: 17px; }
  .gruppo .gt small { font-family: 'Segoe UI'; font-weight: 600; font-size: 12px; color: var(--ink-dim); }
  .gruppo .gt small.ko { color: var(--error); }
  .opz { display: flex; align-items: center; gap: 10px; padding: 11px 2px; border-bottom: 1px solid var(--border); font-size: 15px; }
  .opz input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
  .opz .pz { margin-left: auto; font-size: 13px; color: var(--ink-dim); }
  .riga-carr { display: flex; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .riga-carr .info { flex: 1; min-width: 0; }
  .riga-carr .nome { font-weight: 700; }
  .riga-carr .opz-txt { font-size: 12.5px; color: var(--ink-dim); }
  .riepilogo-limiti { font-size: 13px; color: var(--ink-dim); margin: 10px 0 2px; }
  .avviso { background: #fdecea; color: var(--error); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-top: 10px; }

  /* foglio dettaglio prodotto */
  .fp-foto { width: 100%; aspect-ratio: 16/10; object-fit: cover; border-radius: 14px; background: var(--panel-2); margin: 4px 0 12px; display: block; }
  .fp-desc { font-size: 14.5px; color: var(--ink); line-height: 1.45; }
  .fp-prezzo { font-size: 17px; margin: 10px 0 2px; }
  .fp-sez { font-weight: 800; font-family: 'Baloo 2'; font-size: 15px; margin: 16px 0 6px; }
  .fp-allergeni { display: flex; flex-wrap: wrap; gap: 6px; }
  .fp-allergeni .chip { display: inline-flex; align-items: center; gap: 5px; background: var(--panel-2); border-radius: 99px; padding: 5px 11px; font-size: 13px; font-weight: 600; }
  .fp-nota { width: 100%; border: 1.5px solid var(--border); border-radius: 12px; padding: 11px 12px; font: inherit; font-size: 15px; resize: vertical; min-height: 58px; background: var(--panel); color: var(--ink); }
  .fp-nota:focus { outline: none; border-color: var(--accent); }

  .comanda-storico { background: var(--panel); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-top: 12px; }
  .comanda-storico .t { display: flex; justify-content: space-between; font-weight: 800; font-family: 'Baloo 2'; font-size: 17px; }
  .comanda-storico ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
  .comanda-storico li small { color: var(--ink-dim); }
  .vuoto { text-align: center; color: var(--ink-dim); padding: 40px 10px; }

  /* barra filtro allergeni */
  .barra-filtri { display: flex; gap: 8px; align-items: center; margin: 10px 0 0; }
  .chip-filtro { background: rgba(226,238,249,.82); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border: 1.5px solid rgba(61,134,198,.45); border-radius: 99px; padding: 10px 16px; font-weight: 700; font-size: 14px; color: #2f6ea3; display: inline-flex; align-items: center; gap: 7px; }
  .chip-filtro.attivo { background: #3d86c6; border-color: #3d86c6; color: #fff; box-shadow: 0 6px 16px rgba(61,134,198,.38); }
  .chip-filtro .fn { background: #fff; color: #2f6ea3; border-radius: 99px; padding: 1px 8px; font-size: 12px; font-weight: 800; }
  .barra-filtri .azzera { background: transparent; color: #2f6ea3; font-weight: 700; font-size: 13px; padding: 6px; }
  .filtro-riga { display: flex; align-items: center; gap: 12px; padding: 13px 2px; border-bottom: 1px solid var(--border); font-size: 15.5px; cursor: pointer; }
  .filtro-riga .ic { font-size: 21px; }
  .filtro-riga .sel { margin-left: auto; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border); display: grid; place-items: center; color: transparent; font-size: 15px; font-weight: 900; }
  .filtro-riga.attivo .sel { background: var(--accent); border-color: var(--accent); color: #fff; }
  .filtro-riga.attivo { color: var(--accent); font-weight: 700; }
  .toast { position: fixed; left: 50%; top: calc(84px + env(safe-area-inset-top)); transform: translateX(-50%); background: var(--ok); color: #fff; padding: 12px 18px; border-radius: 12px; z-index: 60; font-weight: 700; box-shadow: 0 6px 20px rgba(0,0,0,.2); max-width: 92vw; text-align: center; }
  .toast.ko { background: var(--error); }
  .caricamento { padding: 80px 0; text-align: center; color: var(--ink-dim); }

  /* morbidezza & fluidità generale */
  .tabs-viste button, .chip-filtro, .menu-scelta, .btn, nav.cat button, .foglio .chiudi {
    transition: transform .13s ease, background .16s ease, box-shadow .16s ease, border-color .16s ease, color .16s ease;
  }
  .btn:active, .menu-scelta:active, .tabs-viste button:active, .chip-filtro:active { transform: scale(.98); }
  .stato, .tabs-viste button, .chip-filtro { box-shadow: 0 2px 8px rgba(70,56,20,.05); }
  .foglio { box-shadow: 0 -10px 40px rgba(0,0,0,.18); }
  @keyframes sali-morbido { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .prodotto { animation: sali-morbido .28s cubic-bezier(.2,.8,.2,1) both; }
  @media (prefers-reduced-motion: reduce) { .prodotto { animation: none; } }

  /* con sfondo foto: scritte nere e leggibili (alone chiaro, niente velo giallo) */
  body.con-sfondo section.categoria h3,
  body.con-sfondo .prodotto .nome,
  body.con-sfondo .prodotto .desc,
  body.con-sfondo .prodotto .limite,
  body.con-sfondo .prodotto .gia,
  body.con-sfondo .prodotto .prezzo,
  body.con-sfondo .vuoto {
    color: #111 !important;
    text-shadow:
      -1.3px -1.3px 0 rgba(255,255,255,.98), 1.3px -1.3px 0 rgba(255,255,255,.98),
      -1.3px 1.3px 0 rgba(255,255,255,.98), 1.3px 1.3px 0 rgba(255,255,255,.98),

  /* FARO: striscia orizzontale bianca sfocata dalla categoria attiva, DIETRO ai prodotti */
  #faro-prodotti { display: none; }
  body.cat-left #faro-prodotti {
    display: block; position: fixed; left: 0; right: 0;
    height: 90px; pointer-events: none;
    z-index: 1;            /* SOTTO .prodotto(2): sta dietro alle card */
    background: linear-gradient(to right,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,.55) 15%,
      rgba(255,255,255,.45) 50%,
      rgba(255,255,255,.25) 80%,
      rgba(255,255,255,0) 100%);
    filter: blur(18px);
    transition: top 0.3s ease;
  }
</style>
</head>

<script>
// ================= CONFIGURAZIONE =================
const SUPABASE_URL = 'https://INSERISCI-PROGETTO.supabase.co'; // <-- URL del NUOVO progetto Supabase
const SUPABASE_ANON_KEY = 'INSERISCI-CHIAVE-PUBBLICA';           // <-- Publishable/anon key del nuovo progetto

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } });
const qs = new URLSearchParams(location.search);
const TENANT = qs.get('tenant');
const TAVOLO = parseInt(qs.get('tavolo'), 10);
const $ = id => document.getElementById(id);
const euro = n => '€' + Number(n || 0).toFixed(2).replace('.', ',');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let info = null;            // risposta di tavolo_info
let catalogo = null;        // { categorie, prodotti }
let menuCorrente = null;    // menu della sessione
let carrello = [];          // [{ chiave, prodotto_id, nome, quantita, opzioni:[{id,nome,gruppo,prezzo}] }]
let persone = { adulti: 2, bambini: 0 };
let menuScelto = null;
let timerConto = null;
let allergeniEsclusi = new Set();   // id degli allergeni da nascondere
let testoCerca = '';                // ricerca prodotto (minuscolo, senza accenti)

// ---------- utilità ----------
function mostra(vista) {
  ['v-caricamento', 'v-errore', 'v-apertura', 'v-menu'].forEach(v => $(v).classList.toggle('hidden', v !== vista));
  $('barra').classList.toggle('hidden', vista !== 'v-menu' || !carrello.length);
  aggiornaStrumenti();
}
function errore(msg) { $('testo-errore').textContent = msg; mostra('v-errore'); }
function toast(msg, ko) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement('div'); t.className = 'toast' + (ko ? ' ko' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ko ? 4500 : 2800);
}
function apri(id) { $(id).classList.remove('hidden'); document.body.style.overflow = 'hidden'; }
function chiudi(id) { $(id).classList.add('hidden'); document.body.style.overflow = ''; }
document.querySelectorAll('[data-chiudi]').forEach(b => b.onclick = () => chiudi(b.closest('.velo').id));
document.querySelectorAll('.velo').forEach(v => v.addEventListener('click', e => { if (e.target === v) chiudi(v.id); }));
function messaggioErrore(e) { return (e && (e.message || e.msg)) || 'Errore di connessione, riprova'; }

// il carrello resta sul telefono se si chiude la pagina per sbaglio (solo comodità)
const CHIAVE_CARRELLO = () => `tavolo_carrello_${TENANT}_${TAVOLO}_${info && info.sessione ? info.sessione.id : ''}`;
function salvaCarrello() { try { localStorage.setItem(CHIAVE_CARRELLO(), JSON.stringify(carrello)); } catch (_) {} }
function caricaCarrello() { try { carrello = JSON.parse(localStorage.getItem(CHIAVE_CARRELLO()) || '[]'); } catch (_) { carrello = []; } }

// ---------- dati ----------
async function rpc(nome, args) {
  const { data, error } = await sb.rpc(nome, args);
  if (error) throw error;
  return data;
}
async function caricaInfo() {
  info = await rpc('tavolo_info', { p_tenant: TENANT, p_tavolo: TAVOLO });
  return info;
}
async function caricaLocale() {
  const { data } = await sb.from('impostazioni_locale').select('nome_locale, logo_url, categorie_laterali, sfondo_url').eq('tenant_id', TENANT).maybeSingle();
  if (data) {
    if (data.nome_locale) { $('nome-locale').textContent = data.nome_locale; document.title = data.nome_locale + ' — Tavolo ' + TAVOLO; }
    if (data.logo_url) { $('logo').src = data.logo_url; $('logo').classList.remove('hidden'); }
    document.body.classList.toggle('cat-left', !!data.categorie_laterali);
    if (data.sfondo_url) {
      // foto di sfondo piena; il faro la schiarisce dietro le card (card e scritte restano davanti)
      document.body.classList.add('con-sfondo');
      document.body.style.backgroundImage = `url('${data.sfondo_url}')`;
      document.body.style.backgroundSize = 'cover';
      document.body.style.backgroundPosition = 'center';
      document.body.style.backgroundRepeat = 'no-repeat';
      document.body.style.backgroundAttachment = 'fixed';
    }
  }
}
async function caricaCatalogo() {
  if (catalogo) return catalogo;
  const [cat, prod, alle] = await Promise.all([
    sb.from('categorie').select('id, nome, ordine_visualizzazione, categoria_collegata_id').eq('tenant_id', TENANT).eq('attivo', true).order('ordine_visualizzazione'),
    sb.from('prodotti').select('id, nome, descrizione, prezzo_base, immagine_url, categoria_id, ordine_visualizzazione, max_pezzi_persona, ' +
      'prodotti_opzioni_variazione(opzioni_variazione(id, nome, prezzo_aggiuntivo, variazioni(id, nome_gruppo, obbligatorio, min_scelte, max_scelte, tipo, ordine_visualizzazione))), ' +
      'prodotti_allergeni(allergene_id)')
      .eq('tenant_id', TENANT).eq('attivo', true).order('ordine_visualizzazione'),
    sb.from('allergeni').select('id, nome, icona').eq('tenant_id', TENANT),
  ]);
  if (cat.error) throw cat.error;
  if (prod.error) throw prod.error;
  const perAllergene = new Map((alle.data || []).map(a => [a.id, a]));
  // gruppi di varianti per prodotto
  for (const p of prod.data) {
    p.allergeni = (p.prodotti_allergeni || []).map(x => perAllergene.get(x.allergene_id)).filter(Boolean)
      .sort((a, b) => a.nome.localeCompare(b.nome));
    const gruppi = new Map();
    for (const l of p.prodotti_opzioni_variazione || []) {
      const o = l.opzioni_variazione; if (!o || !o.variazioni) continue;
      const g = o.variazioni;
      if (!gruppi.has(g.id)) gruppi.set(g.id, { ...g, opzioni: [] });
      gruppi.get(g.id).opzioni.push({ id: o.id, nome: o.nome, prezzo: Number(o.prezzo_aggiuntivo) || 0 });
    }
    p.gruppi = [...gruppi.values()].sort((a, b) => (a.ordine_visualizzazione || 0) - (b.ordine_visualizzazione || 0));
    p.gruppi.forEach(g => g.opzioni.sort((a, b) => a.nome.localeCompare(b.nome)));
  }
  catalogo = { categorie: cat.data, prodotti: prod.data, allergeni: (alle.data || []).slice().sort((a, b) => a.nome.localeCompare(b.nome)) };
  return catalogo;
}

// ---------- regole del menu (le stesse controllate dal database) ----------
function personeSessione() { const s = info.sessione; return (s.adulti || 0) + (s.bambini || 0); }
// Il menu può essere "per piatti" (tab in admin: lista prodotti, a pagamento/compreso,
// scelte comprese, menu fisso) oppure "per categorie" (vecchio modo). Le stesse regole
// sono controllate dal database all'invio: qui servono solo per guidare il cliente.
const perPiatti = () => !!(menuCorrente && menuCorrente.prodotti && menuCorrente.prodotti.length);
const rigaMenu = p => perPiatti() ? menuCorrente.prodotti.find(x => x.id === p.id) : null;
const menuIncluso = () => ['ayce', 'fisso'].includes(info.sessione.menu_tipo);
/** "Bevande incluse": i prodotti segnati bevanda inclusa, con un tetto a persona per tutto il pasto (menu fisso). */
function scelte() {
  if (!perPiatti() || !menuIncluso() || menuCorrente.bevande_incluse_persona === null || menuCorrente.bevande_incluse_persona === undefined) return [];
  const ids = menuCorrente.prodotti.filter(x => x.incluso && x.bevanda_inclusa).map(x => x.id);
  return ids.length ? [{ id: 'bevande', nome: 'Bevanda inclusa', prodotti: ids, quantita_persona: menuCorrente.bevande_incluse_persona }] : [];
}
function sceltaDi(p) { return scelte().find(sc => sc.prodotti.includes(p.id)) || null; }
function infoCategoria(catId) {
  const lista = menuCorrente ? menuCorrente.categorie : [];
  if (!lista.length) return { visibile: true, compresa: false };     // menu senza categorie = tutto a prezzo pieno
  const c = lista.find(x => x.id === catId);
  return c ? { visibile: true, compresa: menuIncluso() && c.compresa } : { visibile: false, compresa: false };
}
/** Il prodotto è visibile in questo menu? */
function visibile(p) {
  if (sceltaDi(p)) return true;
  if (perPiatti()) return !!rigaMenu(p);
  return infoCategoria(p.categoria_id).visibile;
}
/** Compreso nel menu (0 euro, conta per i limiti). I prodotti di una scelta compresa sono gestiti a parte. */
function eCompreso(p) {
  if (sceltaDi(p)) return false;
  if (perPiatti()) { const r = rigaMenu(p); return !!r && menuIncluso() && r.incluso; }
  return infoCategoria(p.categoria_id).compresa;
}
/** Prezzo pieno del prodotto in questo menu (quello del tab se indicato). */
function prezzoMenu(p) { const r = rigaMenu(p); return r && r.prezzo !== null && r.prezzo !== undefined ? Number(r.prezzo) : Number(p.prezzo_base); }
function maxPiatto(p) { const r = rigaMenu(p); return r && r.max_pezzi_persona ? r.max_pezzi_persona : p.max_pezzi_persona; }
function limiteProdotto(p) { return eCompreso(p) && maxPiatto(p) ? maxPiatto(p) * personeSessione() : null; }
function limiteComanda() { const n = info.max_pezzi_persona_comanda; return n ? n * personeSessione() : null; }
function limiteFisso() { return menuCorrente && menuCorrente.limite_piatti_persona ? menuCorrente.limite_piatti_persona * personeSessione() : null; }
function fissiUsati() { return Number((info.sessione || {}).piatti_usati || 0); }
function scelteUsate(sc) { return Number((info.sessione || {}).bevande_usate || 0); }
function pezziProdotto(id) { return carrello.filter(r => r.prodotto_id === id).reduce((s, r) => s + r.quantita, 0); }
/** Pezzi di questo prodotto GIÀ inviati nelle comande precedenti di questa sessione. */
function giaOrdinato(p) {
  let n = 0;
  for (const c of (info.sessione && info.sessione.comande) || [])
    for (const r of c.righe || []) if (r.nome === p.nome) n += Number(r.quantita) || 0;
  return n;
}
function pezziCompresi() { return carrello.filter(r => { const p = prodotto(r.prodotto_id); return p && eCompreso(p); }).reduce((s, r) => s + r.quantita, 0); }
/** Pezzi nel carrello dei prodotti di una scelta compresa. */
function pezziScelta(sc) { return carrello.filter(r => sc.prodotti.includes(r.prodotto_id)).reduce((s, r) => s + r.quantita, 0); }
/** Quante unità di questa scelta sono ancora comprese (pasto intero meno usate meno carrello). */
function residuoScelta(sc) { return Math.max(0, sc.quantita_persona * personeSessione() - scelteUsate(sc) - pezziScelta(sc)); }
const prodotto = id => catalogo.prodotti.find(p => p.id === id);
function prezzoRiga(r) {
  const p = prodotto(r.prodotto_id); if (!p) return 0;
  const sc = sceltaDi(p);
  if (sc) {
    // quota compresa di questa riga: le righe precedenti nel carrello consumano prima
    const prima = carrello.slice(0, carrello.indexOf(r)).filter(x => sc.prodotti.includes(x.prodotto_id)).reduce((s, x) => s + x.quantita, 0);
    const compresi = Math.max(0, Math.min(r.quantita, sc.quantita_persona * personeSessione() - scelteUsate(sc) - prima));
    return (prezzoMenu(p) + r.opzioni.reduce((s, o) => s + o.prezzo, 0)) * (r.quantita - compresi);
  }
  if (eCompreso(p)) return 0;
  return (prezzoMenu(p) + r.opzioni.reduce((s, o) => s + o.prezzo, 0)) * r.quantita;
}
/** Si può aggiungere n pezzi di p? Restituisce il messaggio di errore o null. */
function bloccoAggiunta(p, n) {
  if (!eCompreso(p)) return null;                       // a pagamento o scelta compresa: nessun limite
  const lp = limiteProdotto(p);
  if (lp !== null && pezziProdotto(p.id) + n > lp) return `Massimo ${lp} pezzi di "${p.nome}" per comanda`;
  const lc = limiteComanda();
  if (lc !== null && pezziCompresi() + n > lc) return `Massimo ${lc} piatti per comanda`;
  const lf = limiteFisso();
  if (lf !== null && fissiUsati() + pezziCompresi() + n > lf) return `Il menu comprende ${lf} piatti in tutto: ne avete già scelti ${fissiUsati() + pezziCompresi()}`;
  return null;
}

// ================= 1. APERTURA =================
function disegnaApertura() {
  $('n-adulti').textContent = persone.adulti; $('n-bambini').textContent = persone.bambini;
  document.querySelectorAll('[data-p]').forEach(b => {
    const v = persone[b.dataset.p] + Number(b.dataset.d);
    b.disabled = v < 0 || v > 40 || (b.dataset.p === 'adulti' && v < 0);
  });
  const menu = info.menu || [];
  $('lista-menu').innerHTML = menu.length ? menu.map(m => `
    <button class="menu-scelta ${menuScelto === m.id ? 'sel' : ''}" data-menu="${m.id}">
      <div class="t"><b>${esc(m.nome)}</b><span class="p">${m.tipo !== 'carta' ? euro(m.prezzo_adulto) + ' <small>a persona</small>' : Number(m.prezzo_adulto) ? 'Coperto ' + euro(m.prezzo_adulto) : 'Alla carta'}</span></div>
      ${m.tipo === 'fisso' && (m.limite_piatti_persona || m.bevande_incluse_persona) ? `<div class="d">${[m.limite_piatti_persona ? m.limite_piatti_persona + ' piatti a scelta' : '', m.bevande_incluse_persona ? m.bevande_incluse_persona + (m.bevande_incluse_persona === 1 ? ' bevanda inclusa' : ' bevande incluse') : ''].filter(Boolean).join(' + ')} a persona</div>` : ''}
      ${Number(m.prezzo_bambino) && Number(m.prezzo_bambino) !== Number(m.prezzo_adulto) ? `<div class="d">Bambini ${euro(m.prezzo_bambino)}</div>` : ''}
      ${m.descrizione ? `<div class="d">${esc(m.descrizione)}</div>` : ''}
    </button>`).join('') : '<p class="muted">Nessun menu disponibile in questo momento. Chiedi al personale.</p>';
  document.querySelectorAll('[data-menu]').forEach(b => b.onclick = () => { menuScelto = b.dataset.menu; disegnaApertura(); });
  const m = menu.find(x => x.id === menuScelto);
  const tot = m ? persone.adulti * m.prezzo_adulto + persone.bambini * m.prezzo_bambino : 0;
  $('totale-apertura').innerHTML = m && tot > 0 ? `${m.tipo !== 'carta' ? 'Totale menu' : 'Totale coperti'}: <b>${euro(tot)}</b>` : '';
  $('btn-inizia').disabled = !m || persone.adulti + persone.bambini < 1;
}
document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { persone[b.dataset.p] = Math.max(0, persone[b.dataset.p] + Number(b.dataset.d)); disegnaApertura(); });
$('btn-inizia').onclick = async () => {
  const m = info.menu.find(x => x.id === menuScelto);
  const pers = persone.adulti + persone.bambini;
  const totMenu = persone.adulti * m.prezzo_adulto + persone.bambini * m.prezzo_bambino;
  if (!confirm(`Confermi ${m.nome} per ${pers} ${pers === 1 ? 'persona' : 'persone'}?` + (totMenu > 0 ? `\n${m.tipo !== 'carta' ? 'Totale menu' : 'Totale coperti'} ${euro(totMenu)}` : ''))) return;
  $('btn-inizia').disabled = true;
  try {
    info = await rpc('tavolo_apri', { p_tenant: TENANT, p_tavolo: TAVOLO, p_menu: menuScelto, p_adulti: persone.adulti, p_bambini: persone.bambini });
    if (info.sessione && info.sessione.menu_id !== menuScelto) toast(`Il tavolo era già stato aperto: ${info.sessione.menu_nome}`);
    await entraNelMenu();
  } catch (e) { toast(messaggioErrore(e), true); $('btn-inizia').disabled = false; }
};

// ================= 2. ORDINAZIONE =================
async function entraNelMenu() {
  await caricaCatalogo();
  menuCorrente = (info.menu || []).find(m => m.id === info.sessione.menu_id) || { categorie: [] };
  caricaCarrello();
  carrello = carrello.filter(r => prodotto(r.prodotto_id));
  const s = info.sessione;
  $('sub-testata').textContent = `${s.menu_nome} · ${personeSessione()} ${personeSessione() === 1 ? 'persona' : 'persone'}`;
  disegnaMenu();
  disegnaComande();
  $('barra-filtri').classList.toggle('hidden', !((catalogo.allergeni || []).length));
  aggiornaBarraFiltri();
  mostra('v-menu');
  aggiornaStato();
}

// "Giapponese - Uramaki" -> { gruppo:'Giapponese', label:'Uramaki' }; senza trattino -> nessun gruppo
function dividiCategoria(nome) {
  const m = /^(.*?)\s[-–]\s(.+)$/.exec(nome || '');
  return m ? { gruppo: m[1].trim(), label: m[2].trim() } : { gruppo: null, label: (nome || '').trim() };
}
function passaAllergeni(p) {
  if (!allergeniEsclusi.size) return true;
  return !(p.allergeni || []).some(a => allergeniEsclusi.has(a.id));
}
function senzaAccenti(s) { return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function passaCerca(p) {
  if (!testoCerca) return true;
  return senzaAccenti(p.nome).includes(testoCerca) || senzaAccenti(p.descrizione).includes(testoCerca);
}
function disegnaMenu() {
  const cats = catalogo.categorie
    .map(c => ({ ...c, prodotti: catalogo.prodotti.filter(p => p.categoria_id === c.id && visibile(p) && passaAllergeni(p) && passaCerca(p)) }))
    .filter(c => c.prodotti.length);
  let gruppoPrec = null;
  $('tabs-cat').innerHTML = cats.map((c, i) => {
    const d = dividiCategoria(c.nome);
    const header = d.gruppo && d.gruppo !== gruppoPrec ? `<div class="cat-gruppo">${esc(d.gruppo)}</div>` : '';
    gruppoPrec = d.gruppo;
    return `${header}<button class="${i ? '' : 'on'}" data-vai="${c.id}">${esc(d.label)}</button>`;
  }).join('');
  let gruppoProd = null;
  $('lista-prodotti').innerHTML = cats.length ? cats.map(c => {
    const d = dividiCategoria(c.nome);
    const band = d.gruppo && d.gruppo !== gruppoProd ? `<div class="prod-gruppo">${esc(d.gruppo)}</div>` : '';
    gruppoProd = d.gruppo;
    return `${band}<section class="categoria" id="cat-${c.id}"><h3>${esc(d.label)}</h3>
      <div class="griglia">${c.prodotti.map(p => schedaProdotto(p)).join('')}</div>
    </section>`;
  }).join('') : `<div class="vuoto">${testoCerca ? 'Nessun prodotto trovato per «' + esc(testoCerca) + '».' : allergeniEsclusi.size ? 'Nessun piatto senza gli allergeni selezionati.<br><button class="btn sec" style="max-width:220px;margin:14px auto 0" onclick="azzeraFiltri()">Mostra tutto</button>' : 'Nessun piatto disponibile in questo menu.'}</div>`;
  document.querySelectorAll('[data-vai]').forEach(b => b.onclick = () => {
    document.getElementById('cat-' + b.dataset.vai).scrollIntoView({ behavior: 'smooth' });
  });
  collegaSchede();
  osservaCategorie();
  aggiornaRuota();
  fisheyeProdotti();
  aggiornaBarra();
}

function schedaProdotto(p) {
  const lp = limiteProdotto(p);
  const n = pezziProdotto(p.id);        // nel carrello di QUESTA comanda (in rosso)
  const gia = giaOrdinato(p);           // già inviati prima (in verde)
  const conVarianti = p.gruppi.length > 0;
  // senza varianti: stepper rapido (se già nel carrello) o +; con varianti: + che apre la scheda
  const controllo = !conVarianti && n > 0
    ? `<div class="stepper"><button data-meno="${p.id}">−</button><span class="qnew">${n}</span><button data-piu="${p.id}">+</button></div>`
    : `<button class="piu" ${conVarianti ? `data-apri="${p.id}"` : `data-piu-rapido="${p.id}"`} aria-label="Aggiungi">+</button>`;
  const allMini = (p.allergeni || []).length ? `<span class="allerg-mini" title="${esc((p.allergeni || []).map(a => a.nome).join(', '))}">${(p.allergeni || []).map(a => esc(a.icona)).join('')}</span>` : '';
  const giaLbl = gia > 0 ? `<div class="riga-gia"><span class="gia">già presi: ${gia}</span></div>` : '';
  const badge = conVarianti && n > 0 ? `<span class="qnew-lbl">${n}</span>` : '';
  const media = p.immagine_url ? `<img class="foto" src="${esc(p.immagine_url)}" alt="" loading="lazy">` : '<div class="foto-vuota">🍽️</div>';
  return `<div class="prodotto" id="prod-${p.id}" data-card="${p.id}">
    <div class="media">${media}${badge}<div class="agg">${controllo}</div></div>
    <div class="nome">${esc(p.nome)}</div>
    ${p.descrizione ? `<div class="desc">${esc(p.descrizione)}</div>` : ''}
    <div class="riga-prezzo">${etichettaPrezzo(p)}${allMini}${lp ? `<span class="limite">max ${lp}</span>` : ''}</div>
    ${giaLbl}
  </div>`;
}
function etichettaPrezzo(p) {
  const sc = sceltaDi(p);
  if (sc) {
    const res = residuoScelta(sc);
    return res > 0 ? `<span class="incluso">${esc(sc.nome)} · ${res} ancora ${res === 1 ? 'compresa' : 'comprese'}</span>` : `<span class="prezzo">${euro(prezzoMenu(p))}</span> <span class="limite">${esc(sc.nome)} esaurita</span>`;
  }
  return eCompreso(p) ? '<span class="incluso">Incluso nel menu</span>' : `<span class="prezzo">${euro(prezzoMenu(p))}</span>`;
}
function ridisegnaScheda(id) {
  const p = prodotto(id); if (!p) return;
  const sc = sceltaDi(p);
  for (const pid of sc ? sc.prodotti : [id]) {
    const el = document.getElementById('prod-' + pid); if (!el) continue;
    el.outerHTML = schedaProdotto(prodotto(pid));
  }
  collegaSchede();
}
function collegaSchede() {
  document.querySelectorAll('[data-card]').forEach(el => el.onclick = () => apriProdotto(el.dataset.card));
  document.querySelectorAll('[data-apri]').forEach(b => b.onclick = e => { e.stopPropagation(); apriProdotto(b.dataset.apri); });
  document.querySelectorAll('[data-piu-rapido]').forEach(b => b.onclick = e => { e.stopPropagation(); aggiungi(prodotto(b.dataset.piuRapido), 1, [], ''); });
  document.querySelectorAll('[data-piu]').forEach(b => b.onclick = e => { e.stopPropagation(); aggiungi(prodotto(b.dataset.piu), 1, [], ''); });
  document.querySelectorAll('[data-meno]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const r = carrello.find(x => x.prodotto_id === b.dataset.meno && !x.opzioni.length && !x.nota);
    if (r) { r.quantita--; if (r.quantita <= 0) carrello.splice(carrello.indexOf(r), 1); }
    salvaCarrello(); ridisegnaScheda(b.dataset.meno); aggiornaBarra();
  });
}
let osservatore = null;
function osservaCategorie() {
  if (osservatore) osservatore.disconnect();
  osservatore = new IntersectionObserver(voci => {
    const vis = voci.filter(v => v.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
    if (!vis) return;
    const id = vis.target.id.slice(4);
    document.querySelectorAll('[data-vai]').forEach(b => {
      const on = b.dataset.vai === id; b.classList.toggle('on', on);
      if (on && !document.body.classList.contains('cat-left')) b.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
    });
    aggiornaRuota();
  }, { rootMargin: '-140px 0px -60% 0px' });
  document.querySelectorAll('section.categoria').forEach(s => osservatore.observe(s));
}

// RUOTA categorie infinita: l'attiva grande al centro, le altre a scalare sopra/sotto;
// l'anello è ciclico (sopra la prima riappare l'ultima e viceversa).
function aggiornaRuota() {
  const nav = document.querySelector('body.cat-left nav.cat');
  if (!nav) return;
  const strip = nav.querySelector('.scroll'); if (!strip) return;
  const btns = [...strip.querySelectorAll('button')];
  const N = btns.length; if (!N) return;
  let att = btns.findIndex(b => b.classList.contains('on'));
  if (att < 0) att = 0;
  const VISIBILI = 4;        // quante categorie mostrare sopra e sotto l'attiva
  const centro = nav.clientHeight / 2;
  const semialtezza = centro - 6;  // spazio utile da centro a bordo
  // --- FISHEYE: al centro grande e spaziata, verso i bordi piccola e compressa ---
  // posizione: n in [0..1]; warp concavo (pow < 1) -> gli elementi si stringono vicino al bordo
  const POS_EXP = 0.62;
  // dimensione: 1 al centro, crolla verso il bordo (la lontananza si sente al limite)
  const FONT_MAX = 23, FONT_MIN = 10.5, H_MAX = 88, H_MIN = 22;
  btns.forEach((b, i) => {
    let d = ((i - att) % N + N) % N;   // 0..N-1
    if (d > N / 2) d -= N;             // distanza ciclica con segno
    const ad = Math.abs(d);
    if (ad > VISIBILI) { b.style.opacity = '0'; b.style.pointerEvents = 'none'; return; }
    const n = ad / VISIBILI;                 // 0 (centro) .. 1 (bordo)
    const warp = Math.pow(n, POS_EXP);       // posizione fisheye
    const peso = 1 - Math.pow(n, 1.45);      // 1 al centro -> 0 al bordo, calo marcato sul finale
    b.style.fontSize = (FONT_MIN + (FONT_MAX - FONT_MIN) * peso).toFixed(2) + 'px';
    b.style.minHeight = (H_MIN + (H_MAX - H_MIN) * peso).toFixed(1) + 'px';
    b.style.top = (centro + Math.sign(d) * warp * semialtezza) + 'px';
    b.style.zIndex = String(50 - ad);
    b.style.pointerEvents = '';
    b.style.opacity = String(Math.max(0.4, 1 - n * 0.55)); // i lontani piu sbiaditi
  });
  posizionaFaro();
}

// FISHEYE prodotti: al centro pieni, verso i bordi alto/basso rimpiccioliscono (la distanza si sente al limite)
function fisheyeProdotti() {
  if (!document.body.classList.contains('cat-left')) return;
  const cards = document.querySelectorAll('#lista-prodotti .prodotto');
  if (!cards.length) return;
  const vh = window.innerHeight;
  const cy = vh / 2;              // centro verticale della finestra
  const semi = vh / 2;
  cards.forEach(c => {
    const r = c.getBoundingClientRect();
    const centroCard = r.top + r.height / 2;
    let n = (centroCard - cy) / semi;          // -1 (alto) .. 0 (centro) .. 1 (basso)
    n = Math.max(-1, Math.min(1, n));
    const k = Math.pow(Math.abs(n), 2.2);      // ~0 al centro, cresce nell'ultimo terzo fino al bordo
    const scala = 1 - 0.34 * k;                // fino a ~0.66 proprio al limite
    const op = 1 - 0.42 * k;                   // dissolversi graduale solo verso i bordi
    c.style.transform = 'scale(' + scala.toFixed(3) + ')';
    c.style.opacity = op.toFixed(3);
  });
}

// FARO: striscia orizzontale allineata alla categoria attiva
function posizionaFaro() {
  const faro = document.getElementById('faro-prodotti');
  if (!faro) return;
  const nav = document.querySelector('body.cat-left nav.cat');
  if (!nav) { faro.style.display = 'none'; return; }
  const btnOn = nav.querySelector('button.on');
  if (!btnOn) return;
  const r = btnOn.getBoundingClientRect();
  const centroY = r.top + r.height / 2;
  faro.style.top = (centroY - 45) + 'px';   // 90px altezza, centra sulla categoria
}
let rafFaro = 0;
window.addEventListener('scroll', () => { cancelAnimationFrame(rafFaro); rafFaro = requestAnimationFrame(fisheyeProdotti); }, { passive: true });
window.addEventListener('resize', () => { aggiornaRuota(); fisheyeProdotti(); aggiornaStrumenti(); });

// ---------- filtro allergeni ----------
function aggiornaBarraFiltri() {
  const n = allergeniEsclusi.size;
  $('filtri-n').textContent = n; $('filtri-n').classList.toggle('hidden', !n);
  $('btn-azzera-filtri').classList.toggle('hidden', !n);
  $('btn-filtri').classList.toggle('attivo', !!n);
}
function apriFiltri() {
  const alls = (catalogo && catalogo.allergeni) || [];
  $('filtri-corpo').innerHTML = `<p class="muted" style="margin:4px 0 10px">Tocca gli allergeni da nascondere: i piatti che li contengono spariranno dal menu.</p>` +
    (alls.length ? alls.map(a => `<label class="filtro-riga ${allergeniEsclusi.has(a.id) ? 'attivo' : ''}" data-all="${a.id}"><span class="ic">${esc(a.icona)}</span><span>${esc(a.nome)}</span><span class="sel">✓</span></label>`).join('')
      : '<div class="vuoto">Nessun allergene indicato per questo menu.</div>');

function azzeraFiltri() { allergeniEsclusi.clear(); aggiornaBarraFiltri(); disegnaMenu(); }
$('btn-filtri').onclick = apriFiltri;
$('btn-azzera-filtri').onclick = azzeraFiltri;
$('btn-applica-filtri').onclick = () => chiudi('velo-filtri');
$('btn-reset-filtri').onclick = () => { azzeraFiltri(); apriFiltri(); };

function aggiungi(p, n, opzioni, nota) {
  nota = (nota || '').trim();
  if (!pubOrdinabile()) return;
  const blocco = bloccoAggiunta(p, n);
  if (blocco) { toast(blocco, true); return false; }
  const chiave = p.id + '|' + opzioni.map(o => o.id).sort().join(',') + '|' + nota;
  const esistente = carrello.find(r => r.chiave === chiave);
  if (esistente) esistente.quantita += n;
  else carrello.push({ chiave, prodotto_id: p.id, nome: p.nome, quantita: n, opzioni, nota });
  salvaCarrello(); ridisegnaScheda(p.id); aggiornaBarra();
  return true;
}
function pubOrdinabile() { return !!(info && info.sessione); }

// ---------- foglio dettaglio prodotto (foto grande, info, allergeni, varianti, nota) ----------
let fp = null;
function apriProdotto(id) {
  const p = prodotto(id);
  fp = { p, q: 1 };
  $('fp-nome').textContent = p.nome;
  const compreso = eCompreso(p);
  const sc = sceltaDi(p);
  const prezzoTxt = sc
    ? (residuoScelta(sc) > 0 ? `<span class="incluso">${esc(sc.nome)} · ${residuoScelta(sc)} ancora ${residuoScelta(sc) === 1 ? 'compresa' : 'comprese'}</span>` : `<span class="prezzo">${euro(prezzoMenu(p))}</span>`)
    : (compreso ? '<span class="incluso">Incluso nel menu</span>' : `<span class="prezzo">${euro(prezzoMenu(p))}</span>`);
  const lp = limiteProdotto(p);
  const allerg = (p.allergeni || []).length
    ? `<div class="fp-sez">Allergeni</div><div class="fp-allergeni">${p.allergeni.map(a => `<span class="chip">${esc(a.icona)} ${esc(a.nome)}</span>`).join('')}</div>` : '';
  const varianti = p.gruppi.map(g => {
    const max = g.max_scelte || 1, min = g.min_scelte || (g.obbligatorio ? 1 : 0);
    const tipo = max === 1 ? 'radio' : 'checkbox';
    return `<div class="gruppo" data-g="${g.id}"><div class="gt">${esc(g.nome_gruppo)}<small id="gs-${g.id}">${regolaGruppo(min, max)}</small></div>
      ${g.opzioni.map(o => `<label class="opz"><input type="${tipo}" name="g-${g.id}" value="${o.id}"> ${esc(o.nome)}${!compreso && !sc && o.prezzo ? `<span class="pz">+${euro(o.prezzo)}</span>` : ''}</label>`).join('')}
    </div>`;
  }).join('');
  $('fp-corpo').innerHTML =
    (p.immagine_url ? `<img class="fp-foto" src="${esc(p.immagine_url)}" alt="">` : '') +
    `<div class="fp-prezzo">${prezzoTxt}${lp ? ` <span class="limite">· max ${lp} a comanda</span>` : ''}</div>` +
    (p.descrizione ? `<div class="fp-desc">${esc(p.descrizione)}</div>` : '') +
    allerg +
    varianti +
    `<div class="fp-sez">Nota per la cucina</div><textarea class="fp-nota" id="fp-nota" rows="2" maxlength="140" placeholder="Es. senza cipolla, poco piccante…"></textarea>`;
  $('fp-corpo').querySelectorAll('.gruppo input').forEach(inp => inp.onchange = () => {
    const g = p.gruppi.find(x => x.id === inp.closest('[data-g]').dataset.g);
    const max = g.max_scelte || 1;
    const sel = [...$('fp-corpo').querySelectorAll(`[name="g-${g.id}"]:checked`)];
    if (sel.length > max) { inp.checked = false; toast(`Massimo ${max} scelte per "${g.nome_gruppo}"`, true); }
    aggiornaFp();
  });
  aggiornaFp();
  apri('velo-prodotto');
}
function regolaGruppo(min, max) {
  if (max === 1) return min ? 'Obbligatorio, 1 scelta' : 'Facoltativo, 1 scelta';
  return min ? `Scegli da ${min} a ${max}` : `Fino a ${max}`;
}
function aggiornaFp() {
  const { p } = fp; let ok = true;
  for (const g of p.gruppi) {
    const min = g.min_scelte || (g.obbligatorio ? 1 : 0);
    const n = $('fp-corpo').querySelectorAll(`[name="g-${g.id}"]:checked`).length;
    const el = $('gs-' + g.id);
    el.classList.toggle('ko', n < min);
    if (n < min) ok = false;
  }
  $('fp-q').textContent = fp.q;
  const sc = sceltaDi(p);
  const pagati = sc ? Math.max(0, fp.q - residuoScelta(sc)) : (eCompreso(p) ? 0 : fp.q);
  const prezzo = (prezzoMenu(p) + opzioniScelte().reduce((s, o) => s + o.prezzo, 0)) * pagati;
  $('fp-aggiungi').textContent = ok ? (prezzo ? `Aggiungi · ${euro(prezzo)}` : 'Aggiungi') : 'Completa le scelte';
  $('fp-aggiungi').disabled = !ok;
}
function opzioniScelte() {
  return [...$('fp-corpo').querySelectorAll('.gruppo input:checked')].map(inp => {
    const g = fp.p.gruppi.find(x => x.id === inp.closest('[data-g]').dataset.g);
    const o = g.opzioni.find(x => x.id === inp.value);
    return { id: o.id, nome: o.nome, gruppo: g.nome_gruppo, prezzo: o.prezzo };
  });
}
$('fp-meno').onclick = () => { fp.q = Math.max(1, fp.q - 1); aggiornaFp(); };
$('fp-piu').onclick = () => { const b = bloccoAggiunta(fp.p, fp.q + 1); if (b) { toast(b, true); return; } fp.q++; aggiornaFp(); };
$('fp-aggiungi').onclick = () => {
  const nota = $('fp-nota') ? $('fp-nota').value.trim() : '';
  if (aggiungi(fp.p, fp.q, opzioniScelte(), nota)) { chiudi('velo-prodotto'); toast(`${fp.p.nome} aggiunto`); }
};

// ---------- carrello ----------
function aggiornaBarra() {
  const n = carrello.reduce((s, r) => s + r.quantita, 0);
  $('barra-n').textContent = n;
  const tot = carrello.reduce((s, r) => s + prezzoRiga(r), 0);

// posiziona la barra strumenti sopra il carrello e lascia lo spazio in fondo alla pagina

  const str = $('barra-strumenti'); if (!str) return;

}
function disegnaCarrello() {
  if (!carrello.length) { $('carr-corpo').innerHTML = '<div class="vuoto">La comanda è vuota.</div>'; $('btn-invia').disabled = true; return; }
  const lc = limiteComanda();
  $('carr-corpo').innerHTML = carrello.map((r, i) => {
    const pr = prezzoRiga(r);
    return `<div class="riga-carr"><div class="info"><div class="nome">${esc(r.nome)}</div>
      ${r.opzioni.length ? `<div class="opz-txt">${r.opzioni.map(o => esc(o.nome)).join(' · ')}</div>` : ''}
      ${r.nota ? `<div class="opz-txt">📝 ${esc(r.nota)}</div>` : ''}
      <div class="opz-txt">${pr ? euro(pr) : 'Incluso'}</div></div>
      <div class="stepper"><button data-cm="${i}" data-d="-1">−</button><span>${r.quantita}</span><button data-cm="${i}" data-d="1">+</button></div></div>`;
  }).join('') + riepilogoLimiti();
  $('carr-corpo').querySelectorAll('[data-cm]').forEach(b => b.onclick = () => {

    r.quantita += d; if (r.quantita <= 0) carrello.splice(carrello.indexOf(r), 1);
    salvaCarrello(); disegnaCarrello(); ridisegnaScheda(r.prodotto_id); aggiornaBarra();
  });
  const attesa = secondiAttesa();
  $('carr-avviso').innerHTML = attesa > 0 ? `<div class="avviso" style="margin:0 0 10px">Potrai inviare tra ${formattaAttesa(attesa)}</div>` : '';
  $('btn-invia').disabled = attesa > 0;
}
$('btn-carrello').onclick = () => { disegnaCarrello(); apri('velo-carrello'); };
$('btn-invia').onclick = async () => {
  $('btn-invia').disabled = true; $('btn-invia').textContent = 'Invio in corso…';
  try {
    const righe = carrello.map(r => ({ prodotto_id: r.prodotto_id, quantita: r.quantita, opzioni: r.opzioni.map(o => ({ id: o.id })), nota: r.nota || '' }));
    const r = await rpc('tavolo_ordina', { p_sessione: info.sessione.id, p_righe: righe });
    carrello = []; salvaCarrello();
    info = r.info;
    chiudi('velo-carrello');
    disegnaMenu(); disegnaComande(); aggiornaStato();
    toast(`Comanda ${r.numero_comanda} inviata in cucina!`);
  } catch (e) {
    toast(messaggioErrore(e), true);
    if (/chiuso/i.test(messaggioErrore(e))) setTimeout(avvia, 1500);
  } finally { $('btn-invia').textContent = 'Invia comanda'; disegnaCarrello(); }
};

function riepilogoLimiti() {
  const righe = [];
  const lc = limiteComanda(), lf = limiteFisso();
  if (lc !== null) righe.push(`Piatti del menu in questa comanda: <b>${pezziCompresi()}</b> su ${lc}`);
  if (lf !== null) righe.push(`Piatti del menu nel pasto: <b>${fissiUsati() + pezziCompresi()}</b> su ${lf}`);
  for (const sc of scelte()) {
    const tot = sc.quantita_persona * personeSessione();
    righe.push(`${esc(sc.nome)}: <b>${Math.min(tot, scelteUsate(sc) + pezziScelta(sc))}</b> su ${tot} comprese${scelteUsate(sc) + pezziScelta(sc) > tot ? `, ${scelteUsate(sc) + pezziScelta(sc) - tot} a pagamento` : ''}`);
  }
  return righe.length ? `<div class="riepilogo-limiti">${righe.join('<br>')}</div>` : '';
}

// ---------- tempo per il riordino ----------
let scartoOrologio = 0; // differenza tra orologio del telefono e del server
function secondiAttesa() {
  const p = info && info.sessione && info.sessione.prossimo_ordine_il;
  if (!p) return 0;
  return Math.max(0, Math.ceil((new Date(p).getTime() - (Date.now() + scartoOrologio)) / 1000));
}
function formattaAttesa(s) { const m = Math.floor(s / 60), r = s % 60; return m ? `${m}:${String(r).padStart(2, '0')} min` : `${r} s`; }
function aggiornaStato() {
  clearInterval(timerConto);
  const disegna = () => {
    const s = secondiAttesa(), el = $('stato-comanda');
    if (s > 0) { el.className = 'stato attesa'; el.innerHTML = `<span>⏳</span><span>Prossima comanda tra <b>${formattaAttesa(s)}</b><br><small class="muted">Intanto puoi preparare la prossima</small></span>`; }
    else {
      el.className = 'stato';
      const lc = limiteComanda(), lf = limiteFisso();
      let testo = 'Puoi inviare una comanda' + (lc ? ` · fino a <b>${lc}</b> piatti del menu` : '');
      if (lf !== null) testo += `<br><small class="muted">Piatti del menu usati: <b>${fissiUsati()}</b> su ${lf}</small>`;
      el.innerHTML = `<span>✅</span><span>${testo}</span>`;
      if (timerConto) { clearInterval(timerConto); timerConto = null; }
    }
    if (!$('velo-carrello').classList.contains('hidden')) {
      $('btn-invia').disabled = s > 0 || !carrello.length;
      if (s === 0) $('carr-avviso').innerHTML = '';
    }
  };
  disegna();
  if (secondiAttesa() > 0) timerConto = setInterval(disegna, 1000);
}

// ---------- storico comande ----------
function disegnaComande() {
  const c = (info.sessione && info.sessione.comande) || [];
  $('n-comande').textContent = c.length ? `(${c.length})` : '';
  $('sotto-comande').innerHTML = c.length ? c.slice().reverse().map(k => `
    <div class="comanda-storico"><div class="t"><span>Comanda ${k.numero}</span><span class="muted" style="font-family:'Segoe UI';font-weight:600">${new Date(k.creato_il).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })}</span></div>
      <ul>${(k.righe || []).map(r => `<li>${r.quantita}× ${esc(r.nome)}${(r.opzioni || []).length ? ` <small>(${r.opzioni.map(o => esc(o.nome)).join(', ')})</small>` : ''}${r.nota ? ` <small>📝 ${esc(r.nota)}</small>` : ''}${Number(r.prezzo) ? ` <small>${euro(r.prezzo)}</small>` : ''}</li>`).join('')}</ul></div>`).join('')
    : '<div class="vuoto">Non avete ancora inviato comande.</div>';
}
document.querySelectorAll('[data-vista]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-vista]').forEach(x => x.classList.toggle('on', x === b));
  const inOrdina = b.dataset.vista === 'ordina';
  $('sotto-ordina').classList.toggle('hidden', !inOrdina);
  $('sotto-comande').classList.toggle('hidden', inOrdina);
  const conAll = (catalogo && (catalogo.allergeni || []).length);
  $('barra-filtri').classList.toggle('hidden', !inOrdina || !conAll);
  $('cerca-box').classList.toggle('hidden', !inOrdina);   // la ricerca solo nel menu
  aggiornaStrumenti();
});

// ---------- ricerca prodotto ----------
let rafCerca = 0;
function applicaCerca(v) {
  testoCerca = senzaAccenti(v).trim();
  $('cerca-x').classList.toggle('hidden', !v);
  cancelAnimationFrame(rafCerca);
  rafCerca = requestAnimationFrame(() => { if (catalogo) disegnaMenu(); });
}
(function collegaCerca() {
  const inp = $('cerca-prod'); if (!inp) return;
  inp.addEventListener('input', e => applicaCerca(e.target.value));
  $('cerca-x').onclick = () => { inp.value = ''; applicaCerca(''); inp.focus(); };
})();

// ---------- aggiornamento periodico (altri telefoni, chiusura del conto) ----------
async function controllaSessione() {
  if (document.hidden || !info) return;
  try {
    const prima = info.sessione && info.sessione.id;
    await caricaInfo();
    scartoOrologio = new Date(info.ora_server).getTime() - Date.now();
    if (!info.sessione || info.sessione.id !== prima) { toast('Il tavolo è stato chiuso', true); avvia(); return; }
    if (!$('v-menu').classList.contains('hidden')) { disegnaComande(); aggiornaStato(); }
  } catch (_) {}
}
setInterval(controllaSessione, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) controllaSessione(); });

// ================= AVVIO =================
async function avvia() {
  $('num-tavolo').textContent = Number.isInteger(TAVOLO) ? TAVOLO : '–';
  if (!TENANT || !Number.isInteger(TAVOLO)) { errore('QR non valido: manca il locale o il numero del tavolo.'); return; }
  mostra('v-caricamento');
  try {
    caricaLocale();
    await caricaInfo();
    scartoOrologio = new Date(info.ora_server).getTime() - Date.now();
    if (info.sessione) await entraNelMenu();
    else {
      // tavolo libero: si riparte da zero, scordando i coperti del gruppo precedente
      persone = { adulti: 2, bambini: 0 };
      menuScelto = info.menu && info.menu.length === 1 ? info.menu[0].id : null;
      $('sub-testata').textContent = '';
      disegnaApertura(); mostra('v-apertura');
    }
  } catch (e) { errore(messaggioErrore(e)); }
}
avvia();
</script>
